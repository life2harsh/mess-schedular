<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10141b">
  <meta name="description" content="Live hostel mess menu for Campus 62 and 128 — what's serving now, what's next, and the week ahead.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mess Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <h1 class="wordmark">Mess Scheduler</h1>
      <p class="today-date" id="headerDate"></p>
    </div>
    <div class="campus-toggle" role="tablist" aria-label="Campus">
      <button class="campus-btn" id="campus62" role="tab" aria-selected="true">62</button>
      <button class="campus-btn" id="campus128" role="tab" aria-selected="false">128</button>
    </div>
  </header>

  <nav class="day-strip" id="dayStrip" aria-label="Day of week"></nav>

  <main class="content" id="content">
    <div id="stale" class="stale-note hidden">Showing last week’s menu — this week hasn’t been posted yet.</div>
    <section id="hero" aria-live="polite"></section>
    <section id="upcoming"></section>
  </main>

  <footer class="footer">
    <span>Made with 🍜 by</span>
    <a href="https://github.com/life2harsh" target="_blank" rel="noopener">life2harsh</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
